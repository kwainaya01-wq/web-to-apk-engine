name: Build Web2APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
      app_url:
        description: 'Web URL'
        required: true
      file_format:
        description: 'apk or aab'
        default: 'apk'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Install Cordova
        run: npm install -g cordova
      - name: Build Process
        run: |
          cordova create myApp com.wahid.web2apk "${{ github.event.inputs.app_name }}"
          cd myApp
          cordova platform add android
          # URL replace logic
          sed -i 's|src="index.html"|src="${{ github.event.inputs.app_url }}"|' config.xml
          if [ "${{ github.event.inputs.file_format }}" == "apk" ]; then
            cordova build android --debug
          else
            cd platforms/android && ./gradlew bundleDebug
          fi
            - name: Upload Build
          uses: actions/upload-artifact@v4
          with:
          name: Generated-App
          path: |
            myApp/platforms/android/app/build/outputs/apk/debug/*.apk
            myApp/platforms/android/app/build/outputs/bundle/debug/*.aab
            
